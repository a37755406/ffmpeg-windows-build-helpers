name: Build Custom FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion curl git bzip2 make coreutils yasm nasm p7zip-full texinfo

      - name: Setup FFmpeg build
        run: |
          # 克隆 FFmpeg 编译脚本
          git clone --depth 1 https://github.com/rdp/ffmpeg-windows-build-helpers.git
          cd ffmpeg-windows-build-helpers
          
          # 显示脚本存在
          ls -lh cross_compile_ffmpeg.sh
          
          # 修改脚本，删除不需要的库
          sed -i 's/--enable-libvpx//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libdav1d//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libaom//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libx265//g' cross_compile_ffmpeg.sh
          
          # 开始编译 - 使用快速编译参数
          chmod +x cross_compile_ffmpeg.sh
          echo "开始编译 FFmpeg..."
          # 使用 -d 参数快速编译（64位，跳过一些耗时步骤）
          ./cross_compile_ffmpeg.sh -d --sandbox-ok=y 2>&1 | tee build.log
          
          # 保存日志供检查
          tail -100 build.log

      - name: Find and strip FFmpeg
        if: success()
        run: |
          echo "查找编译的 FFmpeg..."
          find . -name "ffmpeg.exe" -type f 2>/dev/null || echo "未找到 ffmpeg.exe"
          
          # 尝试多个可能的路径
          for path in \
            "ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/ffmpeg.exe" \
            "ffmpeg-windows-build-helpers/sandbox/x86_64/ffmpeg_git/ffmpeg.exe" \
            "sandbox/win64/ffmpeg_git/ffmpeg.exe" \
            "sandbox/x86_64/ffmpeg_git/ffmpeg.exe"
          do
            if [ -f "$path" ]; then
              echo "找到: $path"
              strip "$path" 2>/dev/null || true
              echo "FFmpeg 已瘦身"
              break
            fi
          done

      - name: Upload FFmpeg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-binaries
          path: |
            ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/ffmpeg.exe
            ffmpeg-windows-build-helpers/sandbox/x86_64/ffmpeg_git/ffmpeg.exe
            ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/build.log
          if-no-files-found: warn

      - name: Show build log on failure
        if: failure()
        run: |
          echo "==== 编译日志 ===="
          if [ -f "ffmpeg-windows-build-helpers/build.log" ]; then
            tail -200 ffmpeg-windows-build-helpers/build.log
          else
            echo "未找到构建日志"
          fi
