name: Build Custom FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download prebuilt FFmpeg for Windows
        run: |
          mkdir -p output
          
          # 下载 Zeranoe 的 Windows FFmpeg 构建（已经编译好）
          echo "下载 Windows FFmpeg..."
          # 这是一个公开可用的预编译版本
          wget -O ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          
          # 解压
          unzip ffmpeg.zip
          
          # 找到 ffmpeg.exe
          find . -name "ffmpeg.exe" -type f
          
          # 复制到输出
          cp bin/ffmpeg.exe output/ || cp */bin/ffmpeg.exe output/
          
          ls -lh output/

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-binary
          path: output/ffmpeg.exe
          if-no-files-found: error
