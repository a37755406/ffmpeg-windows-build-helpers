name: Build Custom FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion curl git bzip2 make coreutils yasm nasm p7zip-full

      - name: Setup FFmpeg build
        run: |
          # 克隆 FFmpeg 编译脚本
          git clone --depth 1 https://github.com/rdp/ffmpeg-windows-build-helpers.git
          cd ffmpeg-windows-build-helpers
          
          # 显示脚本存在
          ls -lh cross_compile_ffmpeg.sh
          
          # 修改脚本，删除不需要的库
          sed -i 's/--enable-libvpx//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libdav1d//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libaom//g' cross_compile_ffmpeg.sh
          sed -i 's/--enable-libx265//g' cross_compile_ffmpeg.sh
          
          # 开始编译 - 使用正确的参数
          chmod +x cross_compile_ffmpeg.sh
          echo "开始编译 FFmpeg..."
          ./cross_compile_ffmpeg.sh --compiler-flavors=win64 --build-ffmpeg-static=y --build-ffmpeg-shared=n

      - name: Find and strip FFmpeg
        run: |
          echo "查找编译的 FFmpeg..."
          find . -name "ffmpeg.exe" -type f
          
          # 尝试两个可能的路径
          if [ -f "ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/ffmpeg.exe" ]; then
            strip ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git/ffmpeg.exe
            echo "FFmpeg 已瘦身"
          elif [ -f "ffmpeg-windows-build-helpers/sandbox/x86_64/ffmpeg_git/ffmpeg.exe" ]; then
            strip ffmpeg-windows-build-helpers/sandbox/x86_64/ffmpeg_git/ffmpeg.exe
            echo "FFmpeg 已瘦身"
          else
            echo "警告: 找](#)

