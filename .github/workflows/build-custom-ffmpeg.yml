name: Build Custom FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Strip FFmpeg
        run: |
          mkdir -p output
          
          echo "1. 下载官方轻量基础版 (Essential)..."
          # 这里改用 essential 版本，体积比你之前下载的 gpl 完整版小了一大半
          wget -O ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared-essential.zip || \
          wget -O ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-essential.zip
          
          echo "2. 解压文件..."
          unzip ffmpeg.zip
          
          echo "3. 提取核心 ffmpeg.exe..."
          # 动态寻找并复制 ffmpeg.exe 到 output 目录
          find . -name "ffmpeg.exe" -type f -exec cp {} output/ \;
          
          echo "4. 安装 Linux 交叉编译工具链（用于给 Windows 的 exe 瘦身）..."
          sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-x86-64
          
          echo "5. 物理瘦身：剥离调试符号 (Strip)..."
          # 这一步非常关键！能把 exe 内部没用的调试代码和符号表彻底删掉，直接切掉很大一部分体积
          x86_64-w64-mingw32-strip --strip-all output/ffmpeg.exe || true
          
          echo "6. 检查瘦身后的最终体积："
          ls -lh output/ffmpeg.exe

      - name: Upload Stripped FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mini-binary
          path: output/ffmpeg.exe
          if-no-files-found: error
