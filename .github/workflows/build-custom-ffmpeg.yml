name: Build Custom FFmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0

      - name: Clone FFmpeg build script
        run: |
          echo "Cloning FFmpeg build helpers..."
          git clone --depth 1 https://github.com/rdp/ffmpeg-windows-build-helpers.git ffmpeg-builder
          echo "Checking for script..."
          ls -la ffmpeg-builder/
          chmod +x ffmpeg-builder/cross_compile_ffmpeg.sh
          echo "Script ready!"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion curl git bzip2 make coreutils yasm nasm p7zip-full

      - name: Custom Optimize Script
        run: |
          echo "Modifying cross_compile_ffmpeg.sh..."
          sed -i 's/--enable-libvpx//g' ffmpeg-builder/cross_compile_ffmpeg.sh
          sed -i 's/--enable-libdav1d//g' ffmpeg-builder/cross_compile_ffmpeg.sh
          sed -i 's/--enable-libaom//g' ffmpeg-builder/cross_compile_ffmpeg.sh
          sed -i 's/--enable-libx265//g' ffmpeg-builder/cross_compile_ffmpeg.sh
          echo "Script modified!"
          
      - name: Run Build
        run: |
          cd ffmpeg-builder
          echo "Starting FFmpeg build..."
          ./cross_compile_ffmpeg.sh --compiler-flavors=win64 --build-ffmpeg-static=y --disable-shared

      - name: Archive Production
        run: |
          cd ffmpeg-builder
          echo "Looking for compiled FFmpeg..."
          find . -name "ffmpeg.exe" -type f
          if [ -d "sandbox/win64/ffmpeg_git" ]; then
            cd sandbox/win64/ffmpeg_git
          elif [ -d "sandbox/x86_64/ffmpeg_git" ]; then
            cd sandbox/x86_64/ffmpeg_git
          else
            echo "Error: Could not find ffmpeg build directory"
            exit 1
          fi
          if [ -f "ffmpeg.exe" ]; then
            strip --strip-all ffmpeg.exe || true
            echo "FFmpeg stripped successfully!"
          fi

      - name: Upload FFmpeg Exe
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-stripped-binaries
          path: |
            ffmpeg-builder/sandbox/win64/ffmpeg_git/ffmpeg.exe
            ffmpeg-builder/sandbox/x86_64/ffmpeg_git/ffmpeg.exe
          if-no-files-found: warn
